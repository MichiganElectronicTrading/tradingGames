[project]
name = "mtt-games"
version = "0.1.0"
description = "Solo trading drills for MTT (Michigan Trading and Technology), in your terminal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual"]

[project.scripts]
mtt-games = "mtt_games.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mtt_games"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
